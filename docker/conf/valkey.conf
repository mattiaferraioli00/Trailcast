########################################
# Valkey Configuration File (for Docker)
# Compatible with Valkey 8.x
########################################

# --------------------------------------------------
# NETWORK AND SECURITY
# --------------------------------------------------

# Bind to all interfaces (for Docker container access)
bind 0.0.0.0

# Default port
port 6379

# Disable protected mode (Docker usually handles networking isolation)
protected-mode no

# Uncomment to set a password (recommended in production)
# requirepass superSecretPassword123

# --------------------------------------------------
# DATABASES
# --------------------------------------------------

# Number of logical databases (like Redis)
# Default is 16 (numbered 0–15)
databases 64

# --------------------------------------------------
# GENERAL BEHAVIOR
# --------------------------------------------------

# Do not run as a daemon inside Docker
daemonize no

# Working directory for data persistence
dir /data

# --------------------------------------------------
# PERSISTENCE (RDB + AOF)
# --------------------------------------------------

# Save DB snapshots to disk periodically:
#   save <seconds> <number of changes>
save 900 1
save 300 10
save 60 10000

# Snapshot file name
dbfilename dump.rdb

# Append Only File (AOF) persistence (disabled by default)
appendonly no
appendfilename "appendonly.aof"

# How often fsync is called (only applies if AOF enabled)
appendfsync everysec

# --------------------------------------------------
# LOGGING
# --------------------------------------------------

# Log to stdout (so Docker can capture logs)
logfile ""

# Log verbosity: debug | verbose | notice | warning
loglevel notice

# --------------------------------------------------
# MEMORY MANAGEMENT
# --------------------------------------------------

# Uncomment to set a memory limit
# maxmemory 256mb

# Policy when memory is full:
# allkeys-lru | volatile-lru | allkeys-random | noeviction
# maxmemory-policy allkeys-lru

# --------------------------------------------------
# CLIENT CONNECTIONS
# --------------------------------------------------

# Timeout for idle clients (0 = never)
timeout 0

# TCP keepalive in seconds
tcp-keepalive 300

# --------------------------------------------------
# CLUSTER / REPLICATION (optional)
# --------------------------------------------------

# Replica mode example (uncomment and edit as needed)
# replicaof 192.168.1.10 6379

# --------------------------------------------------
# ADVANCED OPTIONS
# --------------------------------------------------

# Include additional config files if needed
# include /etc/valkey/local.conf
