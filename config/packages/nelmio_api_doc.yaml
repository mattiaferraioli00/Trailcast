nelmio_api_doc:
    documentation:
        info:
            title: Trailcast API
            description: |
                Excursions API: customers list bookable excursions, each with the weather forecast
                for its date and city, and book seats. Staff create new excursions.

                - Weather data from [Open-Meteo](https://open-meteo.com) (geocoding at creation, forecast at read time).
                - `forecast` is `null` when the date is beyond Open-Meteo's 16-day window or the provider is unavailable.
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        paths:
            /login:
                post:
                    tags: [ Auth ]
                    summary: Ottiene un token JWT
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [ email, password ]
                                    properties:
                                        email: { type: string, example: staff@trailcast.test }
                                        password: { type: string, example: staff123 }
                    responses:
                        '200':
                            description: Login riuscito
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token: { type: string }
                        '401':
                            description: Credenziali non valide
    areas: # to filter documented areas
        path_patterns:
            - ^/excursions
            - ^/login
