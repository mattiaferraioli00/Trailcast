nelmio_api_doc:
    documentation:
        info:
            title: Trailcast API
            description: |
                Excursions API: customers list bookable excursions, each with the weather forecast
                for its date and city, and book seats. Staff create new excursions.

                - Weather data from [Open-Meteo](https://open-meteo.com) (geocoding at creation, forecast at read time).
                - `forecast` is `null` when the date is beyond Open-Meteo's 16-day window or the provider is unavailable.
                - Errors follow RFC 9457 (`application/problem+json`).
            version: 1.0.0
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
